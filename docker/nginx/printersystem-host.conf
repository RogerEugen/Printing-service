server {
    listen 80;
    listen [::]:80;

    server_name printer.eleganskyfinance.com;

    allow 10.50.0.0/24;
    deny all;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name printer.eleganskyfinance.com;

    ssl_certificate /etc/letsencrypt/live/printer.eleganskyfinance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/printer.eleganskyfinance.com/privkey.pem;

    allow 10.50.0.0/24;
    deny all;

    client_max_body_size 21m;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
